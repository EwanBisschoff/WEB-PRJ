<!DOCTYPE html>
<html lang="de">

    <title>Rechnung | EasyElectronics</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/invoice.css">
</head>
<body class="dark-mode-screen">

    <!-- Aktions-Buttons oben (Nur im Browser sichtbar) -->

            ← Zurück zu Mein Konto
        </a>
        <button onclick="window.print()" class="btn btn-primary">
            🖨️ Rechnung drucken
        </button>
    </div>

    <!-- Rechnungs-Container -->

            <p>Rechnungsdaten werden geladen...</p>
        </div>

    <!-- Globaler Navbar-Controller (wird hier benötigt falls wir session checken) -->

    <!-- Rechnungs-Script -->
    <script src="js/invoice.js"></script>
