<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Erstellen Sie Ihr persönliches Benutzerkonto bei EasyElectronics, um den unkomplizierten Einkauf und personalisierte Services zu nutzen.">
    <title>Registrierung | EasyElectronics</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Dynamischer Header/Navbar Container -->
    <header id="navbar-container"></header>

    <main class="container">
        <h1>Konto erstellen</h1>

        <form id="registerForm" aria-label="Registrierungsformular">
            <div style="display: flex; flex-direction: column; gap: 5px;">
                <label for="salutation" style="font-weight: 500;">Anrede</label>
                <select id="salutation" required style="padding: 10px; border-radius: 12px; border: 1px solid var(--border-color); background: rgba(0, 0, 0, 0.2); color: var(--text-primary);">
                    <option value="" disabled selected>Anrede wählen</option>
                    <option value="Herr">Herr</option>
                    <option value="Frau">Frau</option>
                    <option value="Divers">Divers</option>
                </select>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label for="firstname" style="font-weight: 500;">Vorname</label>
                    <input type="text" id="firstname" placeholder="Vorname" required autocomplete="given-name">
                </div>

                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label for="lastname" style="font-weight: 500;">Nachname</label>
                    <input type="text" id="lastname" placeholder="Nachname" required autocomplete="family-name">
                </div>
            </div>

            <div style="display: flex; flex-direction: column; gap: 5px;">
                <label for="address" style="font-weight: 500;">Adresse</label>
                <input type="text" id="address" placeholder="Musterstraße 123" required>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 20px;">
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label for="zip" style="font-weight: 500;">PLZ</label>
                    <input type="text" id="zip" placeholder="12345" required>
                </div>
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label for="city" style="font-weight: 500;">Ort</label>
                    <input type="text" id="city" placeholder="Musterstadt" required>
                </div>
            </div>

            <div style="display: flex; flex-direction: column; gap: 5px;">
                <label for="email" style="font-weight: 500;">E-Mail-Adresse</label>
                <input type="email" id="email" placeholder="E-Mail" required autocomplete="email">
            </div>

            <div style="display: flex; flex-direction: column; gap: 5px;">
                <label for="username" style="font-weight: 500;">Username (Benutzername)</label>
                <input type="text" id="username" placeholder="Username" required autocomplete="username">
            </div>

            <div style="display: flex; flex-direction: column; gap: 5px;">
                <label for="password" style="font-weight: 500;">Passwort</label>
                <input type="password" id="password" placeholder="Passwort" required autocomplete="new-password">
            </div>

            <div style="display: flex; flex-direction: column; gap: 5px;">
                <label for="password2" style="font-weight: 500;">Passwort wiederholen</label>
                <input type="password" id="password2" placeholder="Passwort wiederholen" required autocomplete="new-password">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 20px; border-top: 1px dashed var(--border-color); padding-top: 20px; margin-top: 10px;">
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label for="payment_provider" style="font-weight: 500;">Zahlungsart</label>
                    <select id="payment_provider" required style="padding: 10px; border-radius: 12px; border: 1px solid var(--border-color); background: rgba(0, 0, 0, 0.2); color: var(--text-primary);">
                        <option value="Visa">Visa</option>
                        <option value="MasterCard">MasterCard</option>
                        <option value="PayPal">PayPal</option>
                    </select>
                </div>
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label for="payment_details" id="payment_details_label" style="font-weight: 500;">Kartennummer</label>
                    <input type="text" id="payment_details" placeholder="z. B. 4500 1234 5678 9012" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" id="register-submit-btn" style="margin-top: 20px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="8.5" cy="7" r="4"></circle>
                    <line x1="20" y1="8" x2="20" y2="14"></line>
                    <line x1="17" y1="11" x2="23" y2="11"></line>
                </svg>
                Registrieren
            </button>
        </form>

        <div id="status" style="text-align: center; margin-top: 15px; font-weight: 500;"></div>
    </main>

    <!-- Globaler Navbar-Controller -->
    <script src="js/navbar.js"></script>
    <!-- Register-Controller -->
    <script src="js/register.js"></script>
</body>
</html>
