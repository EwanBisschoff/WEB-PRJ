<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">
<title>Registrierung</title>

</head>

<body>

<h1>Registrierung</h1>

<form id="registerForm">

<input type="text"
id="firstname"
placeholder="Vorname"
required>

<br><br>

<input type="text"
id="lastname"
placeholder="Nachname"
required>

<br><br>

<input type="email"
id="email"
placeholder="E-Mail"
required>

<br><br>

<input type="text"
id="username"
placeholder="Username"
required>

<br><br>

<input type="password"
id="password"
placeholder="Passwort"
required>

<br><br>

<input type="password"
id="password2"
placeholder="Passwort wiederholen"
required>

<br><br>

<button type="submit">

Registrieren

</button>

</form>

<script src="js/register.js"></script>

</body>
</html>
