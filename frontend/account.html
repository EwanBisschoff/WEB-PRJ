<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Verwalten Sie Ihr EasyElectronics Kundenkonto. Bearbeiten Sie Profildaten, verwalten Sie Zahlungsarten und sehen Sie Ihre Bestellungen ein.">
    <title>Mein Konto | EasyElectronics</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/account.css">
</head>
<body>

    <!-- Dynamischer Header/Navbar Container -->
    <header id="navbar-container"></header>

    <main class="container">
        <h1>Mein Kundenkonto</h1>

        <div class="account-layout">
            <!-- Linke Spalte: Menü -->
            <aside class="account-menu" aria-label="Konto-Menü">
                <button class="tab-btn active" data-target="panel-profile">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                    Profil bearbeiten
                </button>
                <button class="tab-btn" data-target="panel-password">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                    </svg>
                    Passwort ändern
                </button>
                <button class="tab-btn" data-target="panel-payment">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />
                    </svg>
                    Zahlungsarten
                </button>
                <button class="tab-btn" data-target="panel-orders">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />
                    </svg>
                    Bestellungen
                </button>
            </aside>

            <!-- Rechte Spalte: Inhalte -->
            <section class="account-content">
                
                <!-- Panel 1: Profil bearbeiten -->
                <div id="panel-profile" class="tab-panel active">
                    <h2>Profil bearbeiten</h2>
                    <form id="profileForm" class="reset-form">
                        <div class="form-group mb-20">
                            <label for="profile-salutation" class="form-label">Anrede</label>
                            <select id="profile-salutation" required class="custom-select form-select-custom w-100">
                                <option value="Herr">Herr</option>
                                <option value="Frau">Frau</option>
                                <option value="Divers">Divers</option>
                            </select>
                        </div>

                        <div class="form-row-2 mb-20">
                            <div class="form-group">
                                <label for="profile-firstname" class="form-label">Vorname</label>
                                <input type="text" id="profile-firstname" placeholder="Vorname" required>
                            </div>
                            <div class="form-group">
                                <label for="profile-lastname" class="form-label">Nachname</label>
                                <input type="text" id="profile-lastname" placeholder="Nachname" required>
                            </div>
                        </div>

                        <div class="form-group mb-20">
                            <label for="profile-address" class="form-label">Adresse</label>
                            <input type="text" id="profile-address" placeholder="Musterstraße 123" required>
                        </div>

                        <div class="form-row-1-2 mb-20">
                            <div class="form-group">
                                <label for="profile-zip" class="form-label">PLZ</label>
                                <input type="text" id="profile-zip" placeholder="12345" required>
                            </div>
                            <div class="form-group">
                                <label for="profile-city" class="form-label">Ort</label>
                                <input type="text" id="profile-city" placeholder="Musterstadt" required>
                            </div>
                        </div>
                        
                        <div class="form-group mb-20">
                            <label for="profile-email" class="form-label">E-Mail-Adresse</label>
                            <input type="email" id="profile-email" placeholder="E-Mail-Adresse" required>
                        </div>
                        
                        <div class="form-group mb-20">
                            <label for="profile-username" class="form-label">Username (Benutzername)</label>
                            <input type="text" id="profile-username" placeholder="Benutzername" required>
                        </div>


                        <button type="submit" class="btn btn-primary w-auto">
                            Profildaten speichern
                        </button>
                    </form>
                    <div id="profile-status" class="text-center-status"></div>
                </div>

                <!-- Panel 2: Passwort ändern -->
                <div id="panel-password" class="tab-panel">
                    <h2>Passwort ändern</h2>
                    <form id="passwordForm" class="reset-form">
                        <div class="form-group mb-20">
                            <label for="password-current" class="form-label">Aktuelles Passwort</label>
                            <input type="password" id="password-current" placeholder="Aktuelles Passwort" required>
                        </div>
                        
                        <div class="form-group mb-20">
                            <label for="password-new" class="form-label">Neues Passwort</label>
                            <input type="password" id="password-new" placeholder="Neues Passwort (min. 6 Zeichen)" required>
                        </div>

                        <div class="form-group mb-30">
                            <label for="password-confirm" class="form-label">Neues Passwort wiederholen</label>
                            <input type="password" id="password-confirm" placeholder="Neues Passwort wiederholen" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-auto">
                            Passwort aktualisieren
                        </button>
                    </form>
                    <div id="password-status" class="text-center-status"></div>
                </div>

                <!-- Panel 3: Zahlungsarten -->
                <div id="panel-payment" class="tab-panel">
                    <h2>Zahlungsarten verwalten</h2>
                    
                    <div id="payment-list-container" class="payment-list">
                        <!-- Zahlungsarten werden geladen -->
                    </div>

                    <button id="btn-toggle-new-pay" class="btn btn-outline-muted w-100">
                        + Neue Zahlungsart hinzufügen
                    </button>

                    <!-- Formular für neue Zahlungsart -->
                    <div id="new-payment-form" class="new-payment-form">
                        <div class="flex-column-gap-12">
                            <div class="form-group">
                                <label for="new-provider" class="form-label fs-09">Anbieter</label>
                                <select id="new-provider" class="custom-select form-select-custom w-100">
                                    <option value="Visa">Visa</option>
                                    <option value="MasterCard">MasterCard</option>
                                    <option value="PayPal">PayPal</option>
                                    <option value="Bankeinzug">Bankeinzug</option>
                                </select>
                            </div>
                            
                            <div class="form-group">
                                <label for="new-details" id="new-details-label" class="form-label fs-09">Kartennummer (letzte 4 Ziffern) oder E-Mail</label>
                                <input type="text" id="new-details" placeholder="z. B. •••• 4321" required>
                            </div>

                            <button id="btn-save-pay" class="btn btn-primary mt-5 w-auto">
                                Zahlungsart speichern
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Panel 4: Bestellungen -->
                <div id="panel-orders" class="tab-panel">
                    <h2>Bestellungen & Rechnungen</h2>
                    <div id="orders-list-container" class="order-history-list">
                        <!-- Bestellungen werden geladen -->
                    </div>
                </div>

            </section>
        </div>
    </main>

    <!-- Passwortabfrage Modal für Profiländerungen -->
    <div id="password-modal" class="modal-overlay">
        <div class="modal-box">
            <h3 class="modal-title">Sicherheitsbestätigung</h3>
            <p class="modal-text">
                Bitte geben Sie Ihr aktuelles Passwort ein, um die Änderungen an Ihren Profildaten zu speichern.
            </p>
            <input type="password" id="modal-password-input" placeholder="Aktuelles Passwort" class="w-100" aria-label="Aktuelles Passwort" required>
            <div class="modal-buttons-row">
                <button id="modal-btn-cancel" class="btn btn-secondary">Abbrechen</button>
                <button id="modal-btn-confirm" class="btn btn-primary">Bestätigen</button>
            </div>
        </div>
    </div>

    <!-- Globaler Navbar-Controller -->
    <script src="js/navbar.js"></script>
    <!-- Gemeinsame Hilfsfunktionen (setupTabs, setupPaymentFormToggle) -->
    <script src="js/utils.js"></script>
    <!-- Account Seite Controller -->
    <script src="js/account.js"></script>
</body>
</html>
