<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Verwalten Sie Ihre ausgewählten Premium-Elektronikartikel im EasyElectronics Warenkorb. Überprüfen Sie Ihre Bestellung, ändern Sie die Produktmengen oder fahren Sie mit dem Checkout fort.">
    <title>Ihr Warenkorb | EasyElectronics</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Dynamischer Header/Navbar Container -->
    <header id="navbar-container"></header>

    <main class="container">
        <h1>Ihr Warenkorb</h1>

        <!-- Geteiltes Layout für Warenkorb-Inhalte -->
        <div id="cart-content-view" class="cart-layout" style="display: none;">
            <!-- Linke Spalte: Artikelliste -->
            <section id="cart-items" class="cart-items-container" aria-label="Warenkorb Artikel"></section>

            <!-- Rechte Spalte: Bestellübersicht -->
            <aside class="cart-summary-card" aria-label="Bestellübersicht">
                <h2>Bestellübersicht</h2>
                
                <div class="summary-row">
                    <span>Zwischensumme</span>
                    <span id="cart-subtotal">0,00 €</span>
                </div>
                
                <div class="summary-row">
                    <span>Versandkosten</span>
                    <span id="cart-shipping">0,00 €</span>
                </div>

                <div class="summary-row total">
                    <span>Gesamtsumme</span>
                    <span id="cart-total">0,00 €</span>
                </div>

                <button id="checkout-button" class="btn btn-primary btn-checkout">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14M12 5l7 7-7 7"></path>
                    </svg>
                    Zur Kasse
                </button>
            </aside>
        </div>

        <!-- Leerer Warenkorb Zustand -->
        <div id="empty-cart-view" class="empty-cart-state" style="display: none;">
            <svg class="empty-cart-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="9" cy="21" r="1"></circle>
                <circle cx="20" cy="21" r="1"></circle>
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            </svg>
            <h2>Ihr Warenkorb ist noch leer.</h2>
            <p>Schauen Sie sich in unserem Katalog um und fügen Sie Produkte hinzu!</p>
            <a href="index.html" class="btn btn-primary">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Weiter einkaufen
            </a>
        </div>
    </main>

    <!-- Globaler Navbar-Controller -->
    <script src="js/navbar.js"></script>
    <!-- Warenkorbseite-Controller -->
    <script src="js/cart.js"></script>
</body>
</html>
