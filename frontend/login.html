<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Melden Sie sich bei Ihrem EasyElectronics Account an, um Ihre Bestellungen zu verwalten, gespeicherte Artikel anzusehen und schneller zu bestellen.">
    <title>Anmeldung | EasyElectronics</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Dynamischer Header/Navbar Container -->
    <header id="navbar-container"></header>

    <main class="container">
        <h1>Mit Account anmelden</h1>

        <form id="loginForm" aria-label="Anmeldeformular">
            <div style="display: flex; flex-direction: column; gap: 5px;">
                <label for="login" style="font-weight: 500;">Benutzername oder E-Mail</label>
                <input type="text" id="login" placeholder="Username oder E-Mail" required autocomplete="username">
            </div>

            <div style="display: flex; flex-direction: column; gap: 5px;">
                <label for="password" style="font-weight: 500;">Passwort</label>
                <input type="password" id="password" placeholder="Passwort" required autocomplete="current-password">
            </div>

            <label for="remember">
                <input type="checkbox" id="remember">
                Login merken
            </label>

            <button type="submit" class="btn btn-primary" id="login-submit-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M13.8 12H3"/>
                </svg>
                Anmelden
            </button>
        </form>

        <div id="status" style="text-align: center; margin-top: 15px; font-weight: 500;"></div>
    </main>

    <!-- Globaler Navbar-Controller -->
    <script src="js/navbar.js"></script>
    <!-- Login-Controller -->
    <script src="js/login.js"></script>
</body>
</html>
