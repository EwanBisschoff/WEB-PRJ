<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">
<title>Login</title>

</head>

<body>

<h1>Login</h1>

<form id="loginForm">

<input type="text"
id="login"
placeholder="Username oder E-Mail"
required>

<br><br>

<input type="password"
id="password"
placeholder="Passwort"
required>

<br><br>

<label>

<input type="checkbox" id="remember">

Login merken

</label>

<br><br>

<button type="submit">

Login

</button>

</form>

<div id="status"></div>

<script src="js/login.js"></script>

</body>
</html>
